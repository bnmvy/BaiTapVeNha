<h2>Danh Sách Khách Hàng Phân Nhóm</h2>
<p style="color:red">{{errMessage}}</p>

<table border="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse: collapse;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>
  <tbody>
    <!-- ngFor lồng nhau: Duyệt từng nhóm khách hàng -->
    <ng-container *ngFor="let group of customerGroups">
      <!-- Dòng tiêu đề nhóm -->
      <tr style="background-color: #e6f2ff; font-weight: bold;">
        <td colspan="5">{{group.CustomerTypeId}} - {{group.CustomterTypeName}}</td>
      </tr>

      <!-- Duyệt danh sách khách hàng thuộc nhóm đó -->
      <tr *ngFor="let cus of group.Customers">
        <td>{{cus.Id}}</td>
        <td>{{cus.Name}}</td>
        <td>{{cus.Email}}</td>
        <td>{{cus.Age}}</td>
        <td>
          <img [src]="cus.Image" [alt]="cus.Name" width="40" height="40" style="border-radius: 50%;">
        </td>
      </tr>
    </ng-container>
  </tbody>
</table>
